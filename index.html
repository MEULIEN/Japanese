<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Michi 道 — Daily Japanese for Kyoto</title>
<meta name="description" content="Daily spoken and reading Japanese for living in Kyoto.">
<meta name="theme-color" content="#1F3352">
<meta name="mobile-web-app-capable" content="yes">

<!-- ?v=BUILD_ID cache-buster: bump with sw.js's BUILD_ID so the browser
     never reuses a stale shell (index/app.js/manifest) from HTTP cache. -->
<link rel="manifest" href="manifest.json?v=5">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Michi">
<link rel="icon" href="icons/icon-192.png?v=5">

<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app" role="application" aria-label="Michi Japanese trainer"></div>
<script src="engine.js?v=5"></script>
<script src="app.js?v=5"></script>
<script>
// Service-worker registration tuned for instant updates:
//  - updateViaCache:'none' forces the browser to re-fetch sw.js on every
//    visit, so a newly pushed service worker is picked up right away.
//  - when a new SW takes control (controllerchange), reload once so users
//    see the deployed version immediately — no manual cache clear, no
//    reinstall, and no reload loops (guarded via sessionStorage).
if ('serviceWorker' in navigator) {
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadController && !sessionStorage.getItem('michi_reloaded')) {
      sessionStorage.setItem('michi_reloaded', '1');
      window.location.reload();
    }
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).catch(function () {});
  });
}
</script>
</body>
</html>
